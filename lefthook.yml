# lefthook — local git hooks.
# https://lefthook.dev
#
# Hooks and CI cannot drift because neither spells a command. Every check is a
# script in the package that owns it (`crates/package.json` for cargo,
# `packages/path` for the addon, `apps/docs` for the site) and both a hook and
# a CI step reach it through the same turbo task. Change the command in one
# place and everything that runs it follows.
#
# Scoping is turbo's job now, not a glob's. `pixi run lint` and
# `pixi run typecheck` run the whole repo, and turbo serves a cache hit for
# every task whose inputs did not change — so a commit that touches only Rust
# pays clippy and gets biome for free, and the reverse. That is both faster
# and more correct than the hand-maintained glob list this file used to carry,
# which had to be edited every time a directory was added and had already gone
# stale once (it still named `benches/**`, which does not exist).
#
# The two formatting jobs keep their globs, because they rewrite files: the
# glob decides whether the job wakes at all, and `stage_fixed: true` re-stages
# what it fixed so the commit contains what was checked.
#
# Tasks default to the `default` environment, which is the only one; hooks
# still spell it out with `-e default` so a future extra environment cannot
# silently change what a hook runs.

min_version: "2.0.0"

pre-commit:
  parallel: true
  jobs:
    - name: fmt-rust
      glob: "*.rs"
      run: pixi run -e default -- bun run --cwd crates fmt
      stage_fixed: true

    - name: fmt-js
      glob: "{**/*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc},biome.json,turbo.json,package.json}"
      run: pixi run -e default -- bun run fmt:biome
      stage_fixed: true

    # No glob on purpose. `lint` is rustfmt + clippy + cargo-deny + biome +
    # actionlint, all behind turbo's cache, so the cost is proportional to what
    # actually changed rather than to what the glob guessed.
    - name: lint
      run: pixi run -e default lint

    - name: typecheck
      run: pixi run -e default typecheck

    - name: sandbox-plan
      # The publish plan is a wire format shared with the publisher, so a
      # malformed bundle must fail here rather than as a push to the orphan
      # branch. It needs the pixi-sandbox binary, which is a release download
      # rather than a conda dependency — if it is not on PATH the job reports
      # that and skips, instead of blocking the commit on an unrelated setup
      # step. CI always runs it, where the binary is installed.
      glob: "{pixi.toml,.pixi-sandbox.toml}"
      run: |
        if command -v pixi-sandbox >/dev/null 2>&1; then
          pixi run -e default lint-sandbox-plan
        else
          echo "pixi-sandbox is not on PATH; skipping the publish-plan check (CI always runs it)"
        fi

commit-msg:
  jobs:
    - name: convco
      # `{1}` is the file holding the proposed message (git commit-msg hook argument)
      run: pixi run -e default lint-commit < {1}

pre-push:
  jobs:
    - name: gates
      run: pixi run -e default gates
