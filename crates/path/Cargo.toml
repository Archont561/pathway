[package]
name = "pathway-fs"
description = "pathlib's convenience + ripgrep's walker: ergonomic paths, fused walk, hashing, typed serde I/O"
# The ergonomic Rust surface is publishable as the public pathway-fs crate.
# It remains a preview until the Rust API is ready for its first release.
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/pathway-fs"
keywords = ["filesystem", "pathlib", "directory-walking", "hashing", "serde"]
categories = ["filesystem", "development-tools"]
include = ["Cargo.toml", "README.md", "src/**"]

[lib]
crate-type = ["rlib"]

[dependencies]
# The whole engine. Nothing here re-implements anything in core, which is the
# rule that keeps the two public surfaces from drifting.
pathway-fs-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test frameworks only (task-28), same rule as core: dev-only, so the published
# crate's own graph stays free of a test framework.
rstest = { workspace = true }
proptest = { workspace = true }
