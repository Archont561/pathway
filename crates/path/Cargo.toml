[package]
name = "pathway-fs"
description = "pathlib's convenience + ripgrep's walker: ergonomic paths, fused walk, hashing, typed serde I/O"
# Phase 1 Step 0 owner sign-off is open on the public name (the license is
# settled: MIT), so this crate is not publishable yet. Ships as a preview at
# v0.3 and stabilises at v1.0; see the workspace Cargo.toml.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# The whole engine. Nothing here re-implements anything in core, which is the
# rule that keeps the two public surfaces from drifting.
pathway-fs-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test frameworks only (task-28), same rule as core: dev-only, so the published
# crate's own graph stays free of a test framework.
rstest = { workspace = true }
proptest = { workspace = true }
