[package]
name = "pathway-fs-core"
description = "Native filesystem core: fused walk, hashing, atomic ops, serde codecs"
# The core is a publishable, napi-free Rust library. The crates.io name still
# needs to be claimed by publishing the first real release.
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/pathway-fs-core"
keywords = ["filesystem", "directory-walking", "hashing", "atomic-io", "sandbox"]
categories = ["filesystem", "development-tools"]
include = ["Cargo.toml", "README.md", "src/**"]

[lib]
# rlib, never cdylib: the addon is crates/engine, and core is what
# `cargo test` runs without Node. A cdylib here would put a second native
# artifact in the tree and make the "core has no napi dependency" property
# untestable.
crate-type = ["rlib"]

[dependencies]
# Deliberately napi-free. Every module below is reachable from a plain `cargo
# test`, which is the whole reason this crate exists (D7).
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
fs2 = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test frameworks only (task-28). `[dev-dependencies]` and not
# `[dependencies]` is the whole point: a test framework in `[dependencies]`
# becomes something every consumer of pathway-fs-core must resolve and link
# against in order to build, to serve tests nobody downstream asked for. Dev
# deps stop at this crate's own test run.
rstest = { workspace = true }
proptest = { workspace = true }
