# pathway — THE workspace manifest.
#
#   crates/core     rlib, ALL engine logic, zero napi deps (D7). Publishable to
#                   crates.io as `pathway-fs-core`; `cargo test` needs no Node.
#   crates/path     rlib, the ergonomic pathlib-like Rust surface over core.
#                   Publishable to crates.io as `pathway-fs` (D7, v0.3 preview).
#   crates/engine   cdylib, a thin NAPI-RS wrapper over core. npm-only, never
#                   on crates.io.
#   packages/*      the published TypeScript surface (`@archont561/pathway`).
#   apps/*          the Astro/Starlight documentation site.
#
# ONE environment, built from feature layers so a change to the Rust toolchain,
# the JavaScript toolchain or the repo utilities stays reviewable on its own.
#
# There is no Node.js anywhere in this manifest. `bun` is the only JavaScript
# runtime, and it carries the JS toolchain (turbo, biome, backlog, skills) as
# workspace packages rather than conda dependencies: conda-forge has no `turbo`
# (verified against the channel), and `biome` is resolved from `package.json` so
# one lockfile decides both the linter and the version its `biome.json` schema
# names. Tasks therefore reach the JS toolchain through `bun x` / `bun run`,
# never through a `node_modules/.bin` path — those entries carry a `node`
# shebang, which no environment here provides.
#
# `convco`, `lefthook` and `actionlint` are conda dependencies, not npm ones:
# the git hooks must work on a machine restored from the sandbox branch, and
# `scripts/restore.sh` puts a restored `default` environment's `bin/` on PATH
# but no `node_modules`.
#
# Pins (verified 2026-09-30): rust 1.98.x, bun 1.3.x, convco 0.7.x, lefthook
# 2.1.x, actionlint 1.7.x (conda-forge). Adding a pin means one `pixi lock` to
# refresh pixi.lock — `pixi install --locked` in CI and the devcontainer fails
# until that lands. See .knowledge/ for the architecture these layers serve.

[workspace]
name = "pathway"
version = "0.1.0"
description = "A native, pathlib-inspired filesystem API for TypeScript, Bun, Node and Rust"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.81.0"

# One place to bump a version; the tables below opt in with { workspace = true }.
[workspace.dependencies]
rust = ">=1.98.1,<1.99"
bun = ">=1.3.11,<2"
convco = ">=0.7.2,<0.8"
lefthook = ">=2.1.15,<3"
actionlint = ">=1.7.12,<2"

# ── feature layers ────────────────────────────────────────────────────────────
# `default` carries all three; the layers exist so each toolchain's version bump
# is its own diff, and so a future `rust`-only environment (the crates.io
# consumer path in D7) does not drag the JS toolchain along.

[feature.rust.dependencies]
rust = { workspace = true }
cargo-nextest = ">=0.9.144,<0.10"
cargo-llvm-cov = ">=0.9.1,<0.10"
cargo-deny = ">=0.20.2,<0.21"

[feature.js.dependencies]
# The only JavaScript runtime in the project. `napi build` shells out to `cargo`
# (it runs `cargo metadata` before anything else, and fails with
# `cargo: Permission denied` without it on PATH), so the JS environment also
# carries the Rust toolchain.
bun = { workspace = true }
rust = { workspace = true }

[feature.utils.dependencies]
# Repo utilities shared by the git hooks and CI, so the two cannot drift.
#   convco     — conventional-commit check (commit-msg hook) + CHANGELOG.md
#   lefthook   — the hooks themselves; every hook delegates to a task below
#   actionlint — the GitHub Actions linter
convco = { workspace = true }
lefthook = { workspace = true }
actionlint = { workspace = true }

[environments]
# `default` is pixi's implicit environment, so a task runs as `pixi run <task>`:
# no `-e` flag in a shell, a git hook or a workflow step. It is also the
# environment `.pixi-sandbox.toml` publishes to `sandbox/developer-linux-64`.
default = { features = [
  "rust",
  "js",
  "utils",
] }

# ---------------------------------------------------------------------------
# Tasks. Exactly two kinds live here and nothing else:
#
#   1. Repo-wide verbs. Each is one line — `bun run <script>` — into turbo.
#      The command itself lives in the package that owns it; this file only
#      names the verb and guarantees the environment it runs in.
#   2. Repo management: the things that belong to no package — the changelog,
#      the backlog, the sandbox transport, the git hooks — plus the two checks
#      that cannot run in the airlocked sandbox (one needs the network, one
#      needs a release binary).
#
# What is deliberately NOT here any more: every package-scoped command. There
# is no `clippy`, no `test-rs`, no `fmt-rs`, no `deny`, no `build-native`, no
# `docs-build`. Those are scripts in the package that owns them —
# `crates/package.json` owns every cargo command, `packages/path` owns the
# addon, `apps/docs` owns the site — and turbo runs them, caches them and
# orders them. To reach one directly, filter rather than adding a task back:
#
#   turbo run lint --filter=@repo/rust        # just the Rust gate
#   bun run docs:dev                          # just the docs site
#   bun run --cwd crates coverage:report      # just the coverage summary
#
# The Cargo workspace is ONE turbo package (`@repo/rust`, `crates/package.json`),
# not three. Cargo's unit of work is the workspace: it takes a single lock on
# `target/`, so three per-crate packages would serialise on that lock and run
# slower than one workspace invocation — measured at 320-365 ms against 195 ms
# for `cargo clippy`. Splitting them would buy nothing and cost ~1.8x.
#
# RULE: a task here must never use `cwd = "<a workspace package>"`, and must
# never spell a cargo, tsc, astro or biome command. A task that shells into a
# package runs that package's script with turbo nowhere in the chain, so it
# neither reads nor writes the cache and silently diverges from the turbo task
# for the same verb. That is how this repo once built the docs site twice in
# `pixi run ci`, with two cache keys, for byte-identical output.
# One verb, one path.
#
# NOTE (pixi 0.81): `default-environment` is only accepted on tasks that have a
# `cmd`. Pure aggregators (gates / ci) omit it.
# ---------------------------------------------------------------------------

[tasks]

# ── setup ────────────────────────────────────────────────────────────────────
# One install for the whole Bun workspace. The root package.json declares
# `workspaces: ["packages/*", "apps/*", "crates"]`, so members carry no
# lockfile of their own and the root bun.lock is the single resolution record.
# `crates` is in that list because the Cargo workspace is a turbo package: it
# ships no JavaScript, only the scripts that spell the cargo commands.
bun-install = { cmd = "bun install --frozen-lockfile", description = "Install the Bun workspace from the root lockfile" }
# Install the git hooks. Run once per clone; `lefthook install` is idempotent
# and writes .git/hooks/*, which is not tracked.
hooks-install = { cmd = "lefthook install", description = "Install the lefthook git hooks into .git/hooks" }

# ── repo-wide verbs ──────────────────────────────────────────────────────────
# Each of these is the same command `bun run <verb>` runs at the root, which is
# `turbo run <verb>` over every package that implements it. `pixi run test` and
# `bun run test` are therefore the same run and the same cache entry; pixi adds
# only the environment.
#
# `test` covers both languages: `cargo nextest` plus the Rust doctests come
# from @repo/rust, `bun test` from packages/path. `lint` likewise — rustfmt,
# clippy and cargo-deny from @repo/rust, biome and actionlint as root tasks.
# There is no `-rs` / `-js` split any more because there is no reason for a
# contributor to think about which language a verb belongs to.
build = { cmd = "bun run build", depends-on = [
  "bun-install",
], description = "Build every buildable package: the addon, the TypeScript packages and the docs site (turbo)" }
build-release = { cmd = "bun run build:release", depends-on = [
  "bun-install",
], description = "Build the release artefacts: the Rust workspace in release mode (turbo)" }
test = { cmd = "bun run test", depends-on = [
  "bun-install",
], description = "Run every test suite: Rust unit tests and doctests, and the Bun suites (turbo)" }
typecheck = { cmd = "bun run typecheck", depends-on = [
  "bun-install",
], description = "Type-check every TypeScript package, the docs site included (turbo)" }
lint = { cmd = "bun run lint", depends-on = [
  "bun-install",
], description = "Lint everything: rustfmt, clippy, cargo-deny, biome and actionlint (turbo)" }
fmt = { cmd = "bun run fmt", depends-on = [
  "bun-install",
], description = "Rewrite the sources with rustfmt and biome (turbo)" }
coverage = { cmd = "bun run coverage", depends-on = [
  "bun-install",
], description = "Generate Rust code coverage to crates/lcov.info (turbo)" }
# Persistent. Only apps/docs implements `dev`, so this starts the docs site;
# it stays a repo-wide verb so adding a second long-running package needs no
# new task here.
dev = { cmd = "bun run dev", depends-on = [
  "bun-install",
], description = "Run every package's dev server (currently the docs site)" }
# Restored with the harness (backlog task-4). It stays a repo-wide verb for the
# same reason `test` is: a second benchmark package needs no new task here.
# `benches/walk` generates up to a million files and measures, so it is not part
# of `gates` or `ci` — a number that depends on the machine it ran on does not
# belong in a pass/fail gate.
bench = { cmd = "bun run bench", depends-on = [
  "bun-install",
], description = "Run the benchmark harness and write the per-configuration tables (turbo)" }

# ── checks that belong to no package ─────────────────────────────────────────
# These three stay in pixi because nothing in the workspace owns them.
#
# The advisory check is deliberately outside `lint` and outside `ci`: it is the
# check that would catch a vulnerable transitive dependency before it shipped
# in a crates.io release, so it is not optional in spirit — but cargo-deny 0.20
# has no offline flag and unconditionally fetches the RustSec database from
# GitHub, so folding it into `lint` would break every airlocked sandbox. CI
# runs it as its own step, where a fetch is free.
lint-advisories = { cmd = "bun run --cwd crates lint:advisories", depends-on = [
  "bun-install",
], description = "Check the dependency graph against the RustSec advisory database (needs network)" }
# The publish plan is a wire format shared with the publisher, so a malformed
# bundle must fail here rather than as a push to the orphan branch. It needs
# the pixi-sandbox binary, which is a static release download rather than a
# conda dependency, so CI is where this reliably runs.
lint-sandbox-plan = { cmd = "pixi-sandbox plan --config .pixi-sandbox.toml", description = "Validate the reviewed sandbox publish plan" }
# Reads the proposed message on stdin; the lefthook commit-msg hook pipes it in.
lint-commit = { cmd = "convco check --from-stdin", description = "Validate a commit message against the conventional-commit spec" }

# ── repo management ──────────────────────────────────────────────────────────
# The changelog is generated from conventional commits, which is why
# `lint-commit` is a gate: a message that does not parse is a changelog entry
# that silently disappears.
changelog = { cmd = "convco changelog > CHANGELOG.md", description = "Regenerate CHANGELOG.md from conventional commits" }
changelog-preview = { cmd = "convco changelog", description = "Print the changelog convco would write, without writing it" }
# `bun x`, not the `bunx` spelling: the conda `bun` package ships no `bunx`
# shim, so in this environment the subcommand is the only form that resolves.
# It prefers the workspace install over the registry, so the lockfile still
# decides what runs, and it runs the package under bun rather than through its
# `node` shebang, which nothing here provides.
backlog = { cmd = "bun x backlog", depends-on = [
  "bun-install",
], description = "Manage the Markdown project backlog" }
skills = { cmd = "bun x skills", depends-on = [
  "bun-install",
], description = "Manage the agent skills vendored under .agents/skills" }

# ── agent tooling ────────────────────────────────────────────────────────────
# There is none here, deliberately. opencode is installed by
# `.devcontainer/setup.sh` with a global `bun install`, not by a pixi task:
# `pixi.toml` describes what this repository is built, tested and released
# with, and a ~185 MB agent CLI is none of those. Keeping it out also keeps it
# out of the packed sandbox branch, which would otherwise carry the blob to an
# airlock that has no use for it.

# ── sandbox transport (pixi-sandbox) ─────────────────────────────────────────
# pack → doctor → publish, locally. These exercise the installed pixi-sandbox
# binary directly, so a local run and the generated CI workflow share the exact
# command surface. The branch name must match the reviewed plan
# (`pixi run lint-sandbox-plan`) or this publishes a transport that
# `scripts/restore.sh` will never look for.
#
# `pixi-sandbox` is not a conda dependency: it is a static release binary,
# installed by the one-liner in the pixi-sandbox README, which also runs
# `init github`. Pixi tasks have no `${VAR:-default}` — a plain `$VAR` expands
# and a missing value expands to an empty string — so `SANDBOX_SELF_BIN` is
# the caller's to set, pointing at that binary:
#
#   SANDBOX_SELF_BIN=~/pixi-sandbox-x86_64-unknown-linux-musl pixi run sandbox-pack
sandbox-pack = { cmd = "pixi-sandbox pack --repo-root . --envs default --output-dir .sandbox-out --platform linux-64 --cargo-vendor --fetch-tools --self-bin $SANDBOX_SELF_BIN", description = "Pack the offline sandbox transport" }
sandbox-doctor = { cmd = "pixi-sandbox doctor --branch-location .sandbox-out --verify", description = "Verify a packed transport without writing anything" }
sandbox-publish = { cmd = "pixi-sandbox publish --input-dir .sandbox-out --branch-name sandbox/developer-linux-64 --remote origin", description = "Publish the transport to its orphan branch" }
# One-liner offline reconstruction from the orphan branch, with PATH aliases.
# It lives outside pixi on purpose: the point is that pixi need not be installed
# on the airlocked machine that runs it.
sandbox-restore = { cmd = "bash scripts/restore.sh", description = "Restore the offline sandbox from its orphan branch" }

# ── aggregates ───────────────────────────────────────────────────────────────
# Two, and only two: what must pass before a commit lands, and what CI runs.
# Both resolve their environment through the tasks they depend on (pixi 0.81:
# `default-environment` needs a `cmd`, and these have none).
#
# `gates` is three verbs because every check now lives behind one of them —
# `lint` already carries rustfmt, clippy, cargo-deny, biome and actionlint, and
# `test` already carries the Rust suites and the Bun suites. Adding a check
# means adding a script to the package that owns it, not a line here.
#
# The Astro *production build* is deliberately not in `gates`: it is tens of
# seconds and a bad thing to make a contributor wait on to find out whether a
# comment is well-formatted. What `gates` does cover is `astro check`, through
# the docs site's `typecheck` — cheap, cached, and the check that actually
# catches a broken route.
gates = { description = "Every check that must pass before a commit lands", depends-on = [
  "lint",
  "typecheck",
  "test",
] }
# One command for "what CI runs", and it is runnable offline: everything here
# works in the airlocked sandbox. The workflow adds only the two steps that
# cannot (`lint-advisories` needs the network, `lint-sandbox-plan` needs the
# release binary) and the codecov upload.
ci = { description = "gates, plus coverage and the release and production builds", depends-on = [
  "gates",
  "coverage",
  "build",
  "build-release",
] }
