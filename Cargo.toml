# pathway — the Cargo workspace root.
#
# D7 splits the engine in two so that all of its logic is testable without Node
# and reusable from Rust, and so the N-API glue stays thin:
#
#   crates/core     rlib   ALL engine logic. Zero napi dependencies, so
#                           `cargo test -p pathway-fs-core` needs neither Node
#                           nor a built addon.
#   crates/path     rlib   the ergonomic pathlib-like Rust surface over core.
#   crates/engine   cdylib a thin NAPI-RS wrapper over core. npm-only; it is
#                           glue, not a library, and is never on crates.io.
#
# The members below are named with directory paths so the published crate names
# (`pathway-fs-core`, `pathway-fs`) stay decoupled from `crates.path = "…"`,
# `crates.engine = "…"` in the TypeScript package and any [patch] sections a
# consumer needs.
#
# NOTE: the public Rust crates are now explicitly publishable, but no release has
# been made yet. The names are settled (Step 0 sign-off, 2026-09-30): npm
# `@archont561/pathway`, crates.io `pathway-fs` + `pathway-fs-core` — `pathway`
# itself is taken on crates.io (a 2022 placeholder), hence the `-fs` suffix on
# the Rust family. The NAPI bridge remains `publish = false` because it is an
# npm-only cdylib. The first crates.io release still requires a real API release
# and authenticated publication; `deny.toml` already checks the graph's licence
# policy.

[workspace]
resolver = "2"
members = ["crates/core", "crates/path", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# conda-forge pins rust 1.98.x; napi 3.13 declares MSRV 1.88, so this is the
# binding constraint. Kept here rather than per crate so the MSRV is one edit.
rust-version = "1.98"
# One LICENSE file at the root, so one edit covers every crate and the npm
# package. MIT rather than MIT/Apache-2.0: a dual licence is a decision the
# user of the crate has to make, and dual-licensing an unfinished library spends
# that attention on nothing.
license = "MIT"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]
repository = "https://github.com/Archont561/pathway"
homepage = "https://github.com/Archont561/pathway"

# One place to bump a dependency version; members opt in with `{ workspace = true }`.
[workspace.dependencies]
pathway-fs-core = { path = "crates/core", version = "0.1.0" }

# Traversal (D1 layer 3): `ignore` is ripgrep's walker, which is what gives
# .gitignore and .ignore support for free rather than as a re-implementation.
ignore = "0.4"
globset = "0.4"
regex = "1"

# Content hashing (D3). blake3 is the default; xxhash for the fast path and
# sha2 for interoperability with every other tool that has ever hashed a file.
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"

# Codecs (D4). serde_json is the bridge target for the native TOML/YAML codecs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"

# Filesystem primitives: tempdirs, locks and parallel I/O for the v0.2/v0.3 work.
tempfile = "3"
fs2 = "0.4"
rayon = "1"
thiserror = "2"
libc = "0.2"

# The Phase 3/4 engine crates, pinned here so a version bump is one edit. They
# are *declared, not installed*: the member that consumes each opts in with
# `{ workspace = true }` when its task lands, and until then the crate is
# absent from Cargo.lock and from the airlock transport. Add one at the moment
# its task writes the code that uses it, not before.
#
# Codecs (task-22): CBOR and MessagePack go native because the JS decoders are
# the slow path in `.knowledge/features/serializers.md`. JSON5 deliberately
# stays in JS — the native saving there is not worth an FFI hop.
ciborium = "0.2"
rmp-serde = "1"

# Transformers (task-20). brotli is a separate crate rather than an flate2
# backend because it is a different codec, not a different container.
flate2 = "1"
brotli = "9"

# Detectors (task-23): magic-byte MIME and character encoding. encoding_rs is
# licensed `(Apache-2.0 OR MIT) AND BSD-3-Clause`, all three of which are
# already on the deny.toml allow list, so it adds no licence policy.
infer = "0.22"
encoding_rs = "0.8"

# Native project watching (task-25). notify, not chokidar — "uninstall
# chokidar" is the pitch, so a JS watcher cannot be the answer. CC0-1.0, which
# deny.toml already allows.
notify = "8"

# Path/module resolution (task-24): unrs-resolver behind the TypeScript
# `Resolver` interface. It is enhanced-resolve + tsconfig paths + tsconfck + PnP
# with an LRU cache, which is why this integrates instead of reimplementing
# (`.knowledge/features/pluggable-patterns.md`).
unrs-resolver = "1"

# Test frameworks (task-28), and the only entries here that are dev-only. The
# bounds are the ones task-28 pins. Nothing in `src/` may reach for either: a
# crate that needs proptest to build is a crate whose consumers need proptest
# too. Members opt in under `[dev-dependencies]`, never `[dependencies]`.
rstest = ">=0.27,<0.28"
proptest = ">=1.6,<2"

# The N-API bridge (D1 layer 2). `async` pulls in `tokio_rt`, which is what the
# experimental `#[napi(async_iterator)]` / `AsyncTask` spike in Step 0
# evaluated — the spike froze chunked `AsyncTask` paging (task-1, see
# `.knowledge/architecture/napi-boundary.md`). `serde-json` converts
# `serde_json::Value` to `JsUnknown` for the native TOML/YAML serializers.
# `napi8` matches `pathway_fs_core::NAPI_VERSION` (the declared floor) and is
# what gates BigInt conversions — `modified_nanos: i128` crosses as a BigInt,
# which needs napi6+.
napi = { version = "3", features = ["async", "serde-json", "napi8"] }
napi-derive = "3"
napi-build = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

# Release profile lives at the workspace root — Cargo ignores `[profile.*]` in
# member manifests, so a profile written in crates/engine would silently not
# apply to the binary that ships.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
