name: docs

# Build the Astro/Starlight site for pull requests and publish it to GitHub
# Pages after changes land on main. The site is configured as a project site
# (base: /pathway), so the deploy target is
# https://archont561.github.io/pathway/.
#
# ci.yml already proves the site builds on every change — its `build` step is
# `turbo run build`, and apps/docs is a workspace package, so the site is in
# that graph. This workflow owns the site itself: the Pages deploy happens
# only from main, so no pull request can publish. `docs-check` is also run by
# ci.yml (as part of `typecheck`, and so of `gates`); it is repeated here
# because a renamed route is a broken link rather than a runtime error and
# this is the workflow that publishes. With the shared turbo cache below that
# repetition is a cache hit rather than a second `astro check`. The paths
# filter keeps an unrelated change from paying for a docs job at all.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "scripts/version.ts"
      - "Cargo.toml"
      - "package.json"
      - "bun.lock"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "scripts/version.ts"
      - "Cargo.toml"
      - "package.json"
      - "bun.lock"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not interrupt a deployment that is already in progress.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: default

      # Both steps below are turbo tasks (`docs-build` is
      # `turbo run build --filter=pathway-docs`, `docs-check` is
      # `turbo run typecheck --filter=pathway-docs`), so this workflow pays
      # the same cold-cache cost ci.yml did. The key prefix is shared with
      # ci.yml on purpose: a docs-only pull request can restore the Astro
      # build that the ci workflow already produced for the same inputs.
      # See ci.yml for why the restore-keys, not the key, are what hit.
      - uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      # The site takes its version from `[workspace.package] version` in the
      # root Cargo.toml: apps/docs imports scripts/version.ts directly, so the
      # documented version is resolved at build time and never written into
      # the site nor passed in from the environment. There was a
      # PATHWAY_VERSION variable in front of this once; it read that same
      # manifest field, so it was removed, and apps/docs/turbo.json now
      # declares the manifest a build input instead — that is what invalidates
      # the cache on a version bump. docs-check type-checks the frontmatter
      # and the config, which is where a docs site actually breaks.
      - run: pixi run docs-build
      - run: pixi run docs-check

      # Only main publishes: a PR build stops at proving the site compiles.
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
