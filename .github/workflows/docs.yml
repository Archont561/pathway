name: docs

# Publish the Astro/Starlight site to GitHub Pages, but only after ci is green.
#
# This workflow no longer proves anything about the site — `pixi run ci` builds
# apps/docs as part of `turbo run build`, and type-checks it through
# `typecheck`, so a broken route or a bad frontmatter already fails ci. What is
# left here is the publish, and a publish should never race the thing that
# validates it.
#
# So the trigger is `workflow_run` on ci rather than `push`: GitHub starts this
# workflow when ci *finishes*, and the `if` below drops every run where ci did
# not finish green. That also removes the paths filter this file used to carry
# — there is nothing to decide, because ci already ran for this commit.
#
# The site is a project site (base: /pathway), so the deploy target is
# https://archont561.github.io/pathway/.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not interrupt a deployment that is already in progress.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: build documentation site
    # Two gates, and both are load-bearing.
    #
    # The conclusion check is the one this rewrite is for: `workflow_run` fires
    # on failure and cancellation too, so without it a red ci would publish.
    #
    # The branch check is not redundant with the `branches: [main]` filter
    # above, because that filter constrains `workflow_run` only —
    # `workflow_dispatch` ignores it entirely, so without this a dispatch from
    # a topic branch would push that branch's docs to production Pages. The
    # deploy job inherits both through `needs`, since a skipped dependency
    # skips its dependents.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A workflow_run run checks out the default branch's tip by default,
          # which may already have moved past the commit ci validated. Pin to
          # the exact sha that went green so what publishes is what passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: default

      # Same key prefix as ci, so the Astro build ci already produced for this
      # commit is restored rather than repeated. The docs build declares the
      # root Cargo.toml and scripts/version.ts as inputs (apps/docs/turbo.json),
      # so the restored entry is only used when the documented version and the
      # site sources both match.
      - uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      # The filtered turbo entry point, not a pixi task: apps/docs owns its own
      # build, and pixi only exposes repo-wide verbs. `pathway-docs#build` has
      # no workspace dependencies, so this needs no cargo and no addon.
      - run: pixi run -e default -- bun run docs:build

      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
