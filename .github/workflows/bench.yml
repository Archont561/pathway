name: bench

# The benchmark harness, run on a GitHub Actions runner instead of a laptop.
#
# A full sweep is 10k → 1M files × three scenarios × six subjects — an hour or
# more of dedicated hardware — and the recorded numbers must come from an
# environment that does not change between runs. So the harness runs here, on
# demand, and the report is uploaded as an artifact for transcription into
# `.knowledge/competitive/verified-data.md`.
#
# Two jobs, one per Bun line the task-4 acceptance criteria require:
#
#   bun-1.3 — `pixi run bench --force` through turbo: the blessed path, the
#             same command a contributor runs locally.
#   bun-1.4 — the same driver invoked directly under a Bun 1.4 binary taken
#             from the `@oven/bun-linux-x64` npm tarball, because `Bun.Glob.scan`
#             must be measured on the 1.4 line while pixi pins 1.3.
#
# `--force` re-executes every task so nothing is inherited from a cached run on
# an unrelated commit. The addon profile is not left to chance: turbo's graph
# orders `build:native` before `build:native:release` (the release task depends
# on the dev one), so the release artifact is always the last thing written to
# `packages/path/dist/*.node` — the file the loader loads — in every cache state.
# The driver records the addon's size in the report header anyway, and the
# assert step below turns a debug-profile report into a red job rather than a
# silently incomparable table.
#
# No `rust-cache` and no `.turbo/cache` restore, on purpose: a benchmark run
# wants the same cold build path every time, not a faster one.
#
# Triggers: `workflow_dispatch` for re-measuring on demand (the `sizes` input
# narrows the sweep, e.g. `10000` for a smoke run), and `pull_request` only for
# changes to the harness itself, its wiring, or this file — an engine change
# does not automatically deserve an hour of runner time; dispatch one when the
# numbers need refreshing.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Comma-separated tree sizes (empty = all four: 10000,100000,500000,1000000)"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/bench.yml
      - benches/walk/**
      - turbo.json

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Bun 1.4 line, measured by the bun-1.4 job. Pinned exactly: a benchmark
  # that silently moves to a newer Bun is a benchmark whose history is noise.
  BUN14_VERSION: "1.4.2"

jobs:
  bun-1-3:
    name: bench (bun 1.3 · pixi run bench)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: default

      # `pixi run bench` is the whole point: the DoD requires the harness to
      # run through turbo, so CI proves the same path a contributor runs.
      # PATHWAY_BENCH_SIZES is declared on the bench task in turbo.json, so it
      # passes turbo's strict env mode and is part of the task's cache key.
      - run: pixi run bench --force
        env:
          PATHWAY_BENCH_SIZES: ${{ inputs.sizes || '' }}

      - name: Assert the measured addon was the release build
        run: |
          if grep -q "DEBUG build" "benches/walk/results/results/report.md"; then
            echo "::error::the harness measured a DEBUG addon — see the report artifact"
            exit 1
          fi

      # The report also renders on the run's Summary page, so the numbers can
      # be read without downloading the artifact.
      - name: Publish the report to the run summary
        run: cat "benches/walk/results/results/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bench-report-bun-1-3
          path: benches/walk/results/results/

  bun-1-4:
    name: bench (bun 1.4 · direct driver)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: default

      - run: pixi run bun-install

      # `@archont561/pathway`'s exports resolve to `dist/index.js`, so the TS
      # build is required here, not just the addon: the first version of this
      # job built only `build:native:release` and Bun 1.4 failed instantly with
      # "Cannot find module '@archont561/pathway'" — it worked locally only
      # because a previous local build had left dist/ behind. Both tasks in one
      # turbo invocation: `build` runs tsc plus (through its own deps) the dev
      # addon, and `build:native:release` is ordered after the dev build by
      # turbo.json, so the release .node in dist/ is still the last thing written.
      - run: pixi run bunx turbo run build build:native:release --filter=@archont561/pathway

      - name: Fetch Bun 1.4 from the npm tarball
        run: |
          mkdir -p "$RUNNER_TEMP/bun14"
          npm pack "@oven/bun-linux-x64@$BUN14_VERSION" --pack-destination "$RUNNER_TEMP/bun14"
          tar -xzf "$RUNNER_TEMP/bun14"/oven-bun-linux-x64-*.tgz -C "$RUNNER_TEMP/bun14"
          "$RUNNER_TEMP/bun14/package/bin/bun" --version

      - name: Run the harness under Bun 1.4
        working-directory: benches/walk
        env:
          PATHWAY_BENCH_SIZES: ${{ inputs.sizes || '' }}
        run: |
          "$RUNNER_TEMP/bun14/package/bin/bun" src/main.ts

      - name: Assert the measured addon was the release build
        run: |
          if grep -q "DEBUG build" "benches/walk/results/results/report.md"; then
            echo "::error::the harness measured a DEBUG addon — see the report artifact"
            exit 1
          fi

      # The report also renders on the run's Summary page, so the numbers can
      # be read without downloading the artifact.
      - name: Publish the report to the run summary
        run: cat "benches/walk/results/results/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bench-report-bun-1-4
          path: benches/walk/results/results/
