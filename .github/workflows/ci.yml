name: ci

# Every step in this file is ONE line: `pixi run <task>`. The task definitions
# in pixi.toml are the single source of truth for what a check is, so the exact
# command CI runs is the command you run locally. A step that needs more than
# one line is a missing task, not inline bash.
#
# This mirrors the `ci` task aggregator (gates + release Rust build + the turbo
# build, which covers the TS package and the docs site in one graph) plus the
# two checks that cannot run anywhere but here:
# `lint-sandbox-plan` needs the pixi-sandbox release binary and
# `deny-advisories` needs the network (cargo-deny 0.20 always fetches the
# RustSec database). The airlocked sandbox restores neither, so a developer
# machine and CI agree on everything they can both run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  ci:
    name: ci (lint · test · coverage · build · docs)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: default

      # Cache the cargo target dir and ~/.cargo between runs. Turbo has no
      # remote cache here, so `build:native` (debug addon) and `build-rs`
      # (release) would otherwise recompile the whole workspace from scratch
      # on every push; with the cache only the changed crates rebuild.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Turbo's own task cache. `setup-pixi` caches the conda environment and
      # `rust-cache` caches `target/`, but nothing restored turbo's cache, so
      # every run re-executed the whole graph — the debug addon, the
      # TypeScript build, the Astro production build and `astro check` — even
      # when the inputs were byte-identical to the previous run. `rust-cache`
      # only made the cargo half of `build:native` finish faster; turbo still
      # ran the task.
      #
      # The path is `.turbo/cache`, which is where turbo 2.x writes. Turbo 1.x
      # used `node_modules/.cache/turbo`, and caching that path here would
      # restore nothing while reporting no error at all.
      #
      # The key is per-commit so each run writes a fresh entry; the
      # `restore-keys` prefixes are what actually produce the hits, because a
      # key on `github.sha` alone can never hit — the entry is only written
      # after the run that would have used it. Correctness does not rest on
      # the key: turbo rehashes every task's declared inputs against what it
      # restored, and `globalDependencies` already covers `biome.json`,
      # `pixi.toml` and `pixi.lock`, so a toolchain bump invalidates the whole
      # graph on its own. A stale restore can therefore cost a cache miss and
      # never a wrong artefact.
      #
      # The key is deliberately not workflow-scoped: docs.yml restores the
      # same entries, so a docs-only pull request can reuse the Astro build
      # this workflow already produced.
      - uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      # The publish plan is a wire format shared with the publisher, so a
      # malformed bundle must fail here rather than as a push to the orphan
      # branch. `pixi-sandbox` is a static release binary, not a conda
      # dependency (see pixi.toml), so CI is where this task runs.
      - uses: Archont561/pixi-sandbox/setup@da230c2db2dff8a242c40a89c3a4c66de7777518
        with:
          version: v0.3.2
          token: ${{ github.token }}

      # ── lint ──────────────────────────────────────────────────────────────
      - run: pixi run fmt-check-rs
      - run: pixi run clippy
      - run: pixi run deny
      # Network-only: the RustSec advisory fetch the airlocked sandbox cannot
      # make, so it lives in CI and nowhere else.
      - run: pixi run deny-advisories
      - run: pixi run lint-js
      - run: pixi run lint-actions
      - run: pixi run lint-sandbox-plan

      # ── test ──────────────────────────────────────────────────────────────
      - run: pixi run test-rs
      - run: pixi run test-doc-rs
      - run: pixi run test
      - run: pixi run typecheck

      # ── coverage ──────────────────────────────────────────────────────────
      - run: pixi run coverage
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # ── build (the `ci` aggregator tail) ─────────────────────────────────
      - run: pixi run build-rs
      # `build` is `turbo run build` over the whole workspace, and apps/docs is
      # a workspace package, so this builds the documentation site too. There
      # is no separate `docs-build` step: that used to go around turbo and
      # produced a second, uncached Astro build of the same site.
      - run: pixi run build
