name: ci

# Three caches and one command.
#
# The command is `pixi run ci`, which is `gates` (lint + typecheck + test) plus
# coverage and the release and production builds. It is defined in pixi.toml
# and runs identically on a laptop, so the exact thing CI does is the exact
# thing you can reproduce. Logic lives there, not in this file: a step that
# needs more than one line is a missing task, not inline bash.
#
# Only two checks are separate steps, because neither can run in the airlocked
# sandbox and so neither belongs in `ci`: `lint-advisories` fetches the RustSec
# database (cargo-deny 0.20 has no offline flag) and `lint-sandbox-plan` needs
# the pixi-sandbox release binary.
#
# The three caches cover the three toolchains, and they are what make this
# cheap on an unchanged tree:
#   setup-pixi    — the conda environment (rust, bun, the cargo tools)
#   rust-cache    — target/ and ~/.cargo, so only changed crates recompile
#   actions/cache — .turbo/cache, so a task whose inputs are unchanged does
#                   not run at all
#
# The docs workflow does not duplicate any of this: it waits for this workflow
# to succeed (`workflow_run`) and then publishes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  ci:
    name: ci (lint · test · coverage · build)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      # ── caches ────────────────────────────────────────────────────────────
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: default

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Turbo's task cache. The path is `.turbo/cache`, which is where turbo
      # 2.x writes; turbo 1.x used `node_modules/.cache/turbo`, and caching
      # that path would restore nothing while never reporting an error.
      #
      # The key is per-commit so each run writes a fresh entry; the
      # `restore-keys` prefixes are what actually produce the hits, because a
      # key on `github.sha` alone can never hit — the entry is only written
      # after the run that would have used it. Correctness does not rest on
      # the key: turbo rehashes every task's declared inputs against what it
      # restored, and `globalDependencies` covers biome.json, pixi.toml and
      # pixi.lock, so a toolchain bump invalidates the whole graph on its own.
      # A stale restore can cost a cache miss and never a wrong artefact.
      - uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - uses: Archont561/pixi-sandbox/setup@da230c2db2dff8a242c40a89c3a4c66de7777518
        with:
          version: v0.3.2
          token: ${{ github.token }}

      # ── the gate ──────────────────────────────────────────────────────────
      - run: pixi run ci

      # ── the two checks that cannot run offline ────────────────────────────
      - run: pixi run lint-advisories
      - run: pixi run lint-sandbox-plan

      # ── coverage ──────────────────────────────────────────────────────────
      # `pixi run ci` already produced this: the `coverage` task belongs to
      # @repo/rust, so turbo runs it with crates/ as the working directory and
      # cargo-llvm-cov writes the report there.
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: crates/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
