name: runtime matrix

# The repository gate runs through the restored Pixi environment on Linux. This
# workflow covers the public JavaScript runtime contract on native runners:
# Node 24/26 and Bun 1.3/1.4 on Linux, macOS, and Windows. Bun installs the
# workspace and builds the addon; Node jobs then exercise the same built dist/
# package through Node's ESM loader.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: runtime-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  runtime:
    name: ${{ matrix.runtime }} ${{ matrix.node_version || matrix.bun_version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runtime: node, node_version: "24", bun_version: "1.3.11" }
          - { os: ubuntu-latest, runtime: node, node_version: "26", bun_version: "1.3.11" }
          - { os: ubuntu-latest, runtime: bun, bun_version: "1.3.11" }
          - { os: ubuntu-latest, runtime: bun, bun_version: "1.4.2" }
          - { os: macos-latest, runtime: node, node_version: "24", bun_version: "1.3.11" }
          - { os: macos-latest, runtime: node, node_version: "26", bun_version: "1.3.11" }
          - { os: macos-latest, runtime: bun, bun_version: "1.3.11" }
          - { os: macos-latest, runtime: bun, bun_version: "1.4.2" }
          - { os: windows-latest, runtime: node, node_version: "24", bun_version: "1.3.11" }
          - { os: windows-latest, runtime: node, node_version: "26", bun_version: "1.3.11" }
          - { os: windows-latest, runtime: bun, bun_version: "1.3.11" }
          - { os: windows-latest, runtime: bun, bun_version: "1.4.2" }

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun_version }}
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install the workspace
        run: bun install --frozen-lockfile

      - name: Build the native addon and TypeScript package
        run: |
          bun run --cwd packages/path build:native
          bun run --cwd packages/path build

      - name: Run the Bun suite
        if: matrix.runtime == 'bun'
        run: bun run --cwd packages/path test

      - name: Run the Node smoke suite
        if: matrix.runtime == 'node'
        run: node packages/path/test/node-smoke.mjs

  install-smoke:
    name: npm install smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install and build the package
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/path build:native
          bun run --cwd packages/path build

      - name: Pack and validate publish metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pathway-pack"
          npm pack ./packages/path --pack-destination "$RUNNER_TEMP/pathway-pack"
          package_tarball=$(find "$RUNNER_TEMP/pathway-pack" -name '*.tgz' -print -quit)
          test -n "$package_tarball"
          npm publish --dry-run --provenance "$package_tarball"
          echo "PACKAGE_TARBALL=$package_tarball" >> "$GITHUB_ENV"

      - name: Install the packed artifact and smoke-test it
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/pathway-install"
          mkdir -p "$install_root"
          npm init --yes --prefix "$install_root"
          npm install --ignore-scripts --prefix "$install_root" "$PACKAGE_TARBALL"
          (
            cd "$install_root"
            node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { engineAvailable, Path } from "@archont561/pathway";
          assert.equal(engineAvailable(), true);
          assert.equal(new Path("/a/./b/../c").value, "/a/c");
          NODE
          )
